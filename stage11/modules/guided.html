let current=Math.max(0,Math.min(screens.length-1,Number(new URLSearchParams(location.search).get('i')||state.index||0)));
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function save(patch={}){Object.assign(state,patch,{index:current});const el=document.getElementById('save');if(el){el.textContent='שומר…';el.className='save saving'}try{localStorage.setItem('rfl-stage2',JSON.stringify(state));if(el)setTimeout(()=>{el.textContent='הטיוטה נשמרה';el.className='save saved'},90)}catch(e){if(el){el.textContent='לא ניתן היה לשמור את הטיוטה';el.className='save'}}}
function rail(m){return `<aside class="rail"><div class="rail-code">GUIDED JOURNEY</div><div class="rail-line"></div>${macroTitles.map((t,j)=>{const n=j+1,st=n<m?'complete':n===m?'current':'upcoming';return `<div class="step ${st}" style="top:${104+j*92}px"><img src="${A[st]}" alt=""><span class="n">0${n}</span><span class="t">${t}</span></div>`}).join('')}<div class="rail-privacy">מידע רגיש מוצג רק בהקשר הנדרש לתיק.</div></aside>`}</script><script>
function choiceRows(s){const val=state[s.key]||s.choices[0][0];return s.choices.map(([v,t,sub])=>`<button class="choice ${v===val?'selected':''}" data-choice="${esc(s.key)}" data-value="${esc(v)}"><img src="${v===val?A.radioOn:A.radioOff}" alt=""><span class="ct">${t}</span><span class="cs">${sub}</span></button>`).join('')}
function field(name,label,ph,type='text'){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(state[name]||'')}" placeholder="${ph}" autocomplete="off"></div>`}
function renderBody(s){
 if(s.type==='choices')return choiceRows(s);
 if(s.type==='fields')return `<div class="grid2">${s.fields.map(x=>field(...x)).join('')}</div><div class="note">${s.note}</div>`;
 if(s.type==='contact')return `<div class="grid2">${field('phone','טלפון','050-0000000','tel')}${field('email','דוא״ל','name@example.com','email')}</div><div style="margin-top:26px">${singleChoice('smsUpdates','yes','עדכונים בהודעה','לקבלת התראות על פעולות בתיק')}</div>`;
 if(s.type==='basics')return `${singleChoice('citizenship','declared','אזרחות / תושבות','נמסרת כעובדה ותיבדק לפי הצורך',true)}<div class="grid2" style="margin-top:22px">${field('dob2','תאריך לידה','נמשך מפרטי הזיהוי')}${field('city','יישוב מגורים','הקלידו יישוב')}</div><div class="note">המערכת לא מציגה “זכאי/לא זכאי”. נתוני הבסיס קובעים אילו בדיקות המשך ייפתחו.</div>`;
 if(s.type==='evidence-choice')return `${twoProof(s.key)}<div class="field" style="margin-top:22px"><label>${s.label}</label><input name="${s.key}Detail" aria-label="${s.label}" value="${esc(state[s.key+'Detail']||'')}" placeholder="${s.placeholder}"></div>`;
 if(s.type==='residence')return `<div class="grid2">${field('resCity','יישוב','הקלידו יישוב')}${field('resSince','ממתי אתם מתגוררים בכתובת?','MM / YYYY')}</div><div style="margin-top:22px">${singleChoice('resProof','yes','יש מסמך כתובת תומך','אפשר לצרף בשלב המסמכים')}</div><div class="note">בדיקת רלוונטיות היישוב תיעשה מול המקור הרשמי העדכני, ולא לפי רשימה קשיחה במסך.</div>`;
 if(s.type==='employment')return `<div class="grid2">${field('role','תפקיד','תיאור קצר של התפקיד')}${field('employer','מעסיק / ארגון','שם הארגון')}</div><div style="margin-top:22px">${singleChoice('employmentProof','yes','קיים מסמך תומך','אישור / מסמך לפי סוג המסלול')}</div>`;
 if(s.type==='health')return `${singleChoice('healthDeclared','yes','הצהרה נמסרה','המידע יסומן כרגיש ויוצג רק למורשים',true)}<div style="margin-top:14px">${singleChoice('healthDoc','yes','יש מסמך רפואי תומך','העלאה תתבצע באזור רגיש נפרד')}</div><div class="guard">אין כאן אבחון, חיווי רפואי או החלטה אוטומטית. כל צורך במסמך נוסף מוצג כבקשת מידע בלבד.</div>`;
 if(s.type==='sensitive')return `<div class="field"><label>הסבר עובדתי</label><textarea name="sensitiveNote" aria-label="הסבר עובדתי למידע רגיש" placeholder="כתבו רק מידע רלוונטי שאתם מבקשים להביא לעיון">${esc(state.sensitiveNote||'')}</textarea></div><div style="margin-top:16px">${singleChoice('sensitiveAttach','yes','לצרף מסמך','המסמך יוגדר כרגיש ויעבור לעיון מורשה')}</div><div class="guard">המערכת שומרת את ההצהרה והמסמך; המשמעות וההשפעה על דרך הפעולה נקבעות רק לאחר בדיקה משפטית.</div>`;
 if(s.type==='list')return `<div class="status-list ${s.id===25?'checklist':''}">${s.rows.map(([l,st,k])=>`<div class="status-row"><span class="status ${k==='warn'?'warn':''}">${st}</span><span class="label">${l}</span></div>`).join('')}</div>`;
 if(s.type==='upload')return uploadBox(s);
 if(s.type==='missing'){const v=state.missingAction||'upload';return `<div class="missing-card"><h3>חסר מסמך תומך למסלול שנבדק</h3><p>אפשר להעלות עכשיו, לשמור ולהמשיך מאוחר יותר, או להעביר לעיון עם ציון שהפריט חסר.</p><div class="actions2"><button class="action-tile ${v==='upload'?'selected':''}" data-choice="missingAction" data-value="upload"><b>להעלות מסמך</b><span>השלמה לפני העברה</span></button><button class="action-tile ${v==='later'?'selected':''}" data-choice="missingAction" data-value="later"><b>לשמור להמשך</b><span>הפריט יישאר מסומן כחסר</span></button></div></div>`}
 if(s.type==='assessment')return `<div class="status-list">${s.rows.map(([l,st,k])=>`<div class="status-row"><span class="status ${k==='warn'?'warn':''}">${st}</span><span class="label">${l}</span></div>`).join('')}</div><div class="guard">אין כאן התחייבות לרישיון. הסיכום משקף את מצב התיק בלבד.</div>`;
 if(s.type==='payment')return `<div class="payment"><div class="pay-summary"><div class="pay-label">שירות שנבחר</div><div class="pay-title">ליווי משפטי לפי היקף התיק שאושר</div><div class="pay-price">המחיר יוצג כאן רק לאחר שנקבע ואושר</div></div><div class="consent"><label><input id="paymentConsent" type="checkbox" ${state.paymentConsent?'checked':''}><span>אני מאשר/ת את היקף השירות והמחיר שיוצגו</span></label><small>לא יתבצע חיוב לפני אישור</small></div></div>`;
 return ''
}
function singleChoice(key,value,title,sub,selected=false){const on=(state[key]||selected?value:'')===value;return `<button class="choice ${on?'selected':''}" data-choice="${key}" data-value="${value}"><img src="${on?A.radioOn:A.radioOff}" alt=""><span class="ct">${title}</span><span class="cs">${sub}</span></button>`}
function twoProof(key){const v=state[key]||'yes';return `<button class="choice ${v==='yes'?'selected':''}" data-choice="${key}" data-value="yes"><img src="${v==='yes'?A.radioOn:A.radioOff}" alt=""><span class="ct">יש לי מסמך תומך</span><span class="cs">ניתן לצרף מסמך בשלב המסמכים</span></button><button class="choice ${v==='no'?'selected':''}" data-choice="${key}" data-value="no"><img src="${v==='no'?A.radioOn:A.radioOff}" alt=""><span class="ct">אין לי מסמך כרגע</span><span class="cs">הפריט יסומן כחסר ולא ייחשב כמוכח</span></button>`}
function uploadBox(s){const u=state[s.key];return `<div class="upload-zone"><h3>${s.uploadTitle}</h3><p>PDF / JPG / PNG · הקובץ יישמר עם הקשר, מקור וסטטוס בדיקה</p><button class="upload-btn" data-upload="${s.key}">בחירת קובץ</button><input type="file" id="up-${s.key}" accept=".pdf,.jpg,.jpeg,.png" hidden><div class="upload-status">${u?`הועלה: ${esc(u)} · סטטוס: Uploaded`:'לא נבחר קובץ'}</div></div><div class="note">${s.link}</div>`}
function render(){const s=screens[current];const backDisabled=current===0;const nextLabel=s.id===34?'המשך לאזור האישי':'שמירה והמשך';document.title=`RFL — ${s.code}`;history.replaceState({},'',location.pathname+'?i='+current);document.getElementById('root').innerHTML=`<main class="app"><header class="top"><div class="brand">RFL / GUIDED INTAKE</div><div class="case">תיק חדש / טיוטה נשמרת</div></header>${rail(s.macro)}<div class="main-code">${s.code}</div><h1 class="main-title">${s.title}</h1><p class="main-body">${s.body}</p><div class="accent"></div><section class="instrument ${s.sensitive?'sensitive':''}"><div class="caption">${s.caption}</div><div class="instrument-body">${renderBody(s)}</div></section><button class="footer-back" ${backDisabled?'disabled':''}>חזרה</button><button class="footer-next" ${s.id===34&&!state.paymentConsent?'disabled':''}>${nextLabel}</button><div id="save" class="save saved">הטיוטה נשמרת אוטומטית</div></main>`;bind()}
function bind(){document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{save({[b.dataset.choice]:b.dataset.value});render()}));document.querySelectorAll('input[name],textarea[name]').forEach(el=>{el.addEventListener('input',()=>{state[el.name]=el.value});el.addEventListener('blur',()=>save({[el.name]:el.value}))});const pc=document.getElementById('paymentConsent');if(pc)pc.addEventListener('change',()=>{save({paymentConsent:pc.checked});render()});document.querySelectorAll('[data-upload]').forEach(b=>{b.onclick=()=>document.getElementById('up-'+b.dataset.upload).click();const i=document.getElementById('up-'+b.dataset.upload);i.onchange=()=>{if(!i.files[0])return;const file=i.files[0];const ok=/\.(pdf|jpg|jpeg|png)$/i.test(file.name);if(!ok){toast('הקובץ נדחה: יש לבחור PDF / JPG / PNG');return}save({[b.dataset.upload]:file.name});render()}});document.querySelector('.footer-back').onclick=()=>{if(current>0){save();current--;render();window.scrollTo(0,0)}};document.querySelector('.footer-next').onclick=()=>{save();if(current<screens.length-1){current++;render();window.scrollTo(0,0)}else { window.parent.location.href='/login?next=/app' }}}
render();
</script></body></html>
