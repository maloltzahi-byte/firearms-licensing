name: Generate Canonical Lockfile

on:
  push:
    branches:
      - rc/production-readiness-2026-08-27

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate pnpm lockfile using pinned package manager
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version
          pnpm install --lockfile-only --ignore-scripts
          test -s pnpm-lock.yaml
      - name: Commit lockfile
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Add reproducible pnpm lockfile'
          git push origin HEAD:rc/production-readiness-2026-08-27
