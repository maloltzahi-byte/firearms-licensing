name: Restore canonical localities

on:
  push:
    branches:
      - rc/production-readiness-2026-08-27

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore canonical locality dictionary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          archive = pathlib.Path('source-archives/firearms-licensing-project.zip')
          if not archive.is_file():
              raise SystemExit('canonical source archive missing')
          with zipfile.ZipFile(archive) as zf:
              matches = [n for n in zf.namelist() if n.endswith('/data/localities.json') or n == 'data/localities.json']
              if len(matches) != 1:
                  raise SystemExit(f'expected one localities.json, found {len(matches)}')
              payload = zf.read(matches[0])
          expected = '7a66a50a22d1dd138e81f59ae29449fec2ea5eac3b30676bbf2e43ad10f042ea'
          if hashlib.sha256(payload).hexdigest() != expected:
              raise SystemExit('canonical localities SHA mismatch')
          data = json.loads(payload)
          if len(data.get('localities', [])) != 1298:
              raise SystemExit('canonical localities count mismatch')
          pathlib.Path('data').mkdir(exist_ok=True)
          pathlib.Path('data/localities.json').write_bytes(payload)
          PY
      - name: Commit restored canonical file
        run: |
          if git diff --quiet -- data/localities.json && git ls-files --error-unmatch data/localities.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/localities.json
          git commit -m "Restore canonical locality dictionary"
          git push origin HEAD:rc/production-readiness-2026-08-27
