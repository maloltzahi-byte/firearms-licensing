name: Restore canonical localities

on:
  push:
    branches:
      - rc/production-readiness-2026-08-27

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore canonical locality dictionary
        run: |
          set -euo pipefail
          archive=source-archives/firearms-licensing-project.zip
          test -f "$archive"
          entry="$(unzip -Z1 "$archive" | grep -E '(^|/)data/localities\.json$' | head -n 1)"
          test -n "$entry"
          unzip -p "$archive" "$entry" > data/localities.json
          test "$(python3 -c "import json; print(len(json.load(open('data/localities.json'))['localities']))")" = "1298"
          echo "7a66a50a22d1dd138e81f59ae29449fec2ea5eac3b30676bbf2e43ad10f042ea  data/localities.json" | sha256sum -c -
      - name: Commit restored canonical file
        run: |
          if git diff --quiet -- data/localities.json && git ls-files --error-unmatch data/localities.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/localities.json
          git commit -m "Restore canonical locality dictionary"
          git push origin HEAD:rc/production-readiness-2026-08-27
