name: Lead MVP Figma Parity CI

on:
  push:
    branches:
      - lead-mvp/figma-1to1-2026-09-03
    paths:
      - 'lead-mvp/**'
      - '.github/workflows/lead-mvp-figma-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Package browser-QA runtime
        run: tar -czf ../lead-mvp-runtime.tgz .next public node_modules package.json next.config.ts
      - name: Upload browser-QA runtime
        uses: actions/upload-artifact@v4
        with:
          name: lead-mvp-runtime
          path: lead-mvp-runtime.tgz
          if-no-files-found: error
          retention-days: 1
