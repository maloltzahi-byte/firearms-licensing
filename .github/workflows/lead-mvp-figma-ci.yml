name: Lead MVP Figma Parity CI

on:
  push:
    branches:
      - lead-mvp/figma-1to1-2026-09-03
    paths:
      - 'lead-mvp/**'
      - '.github/workflows/lead-mvp-figma-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Verify
        run: pnpm verify
