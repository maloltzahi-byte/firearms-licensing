name: Auth UAT Once

on:
  push:
    branches:
      - rc/production-readiness-2026-08-27

permissions:
  contents: read

jobs:
  auth-uat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://lcvshepgzizrlqbzvjoe.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_44F1VklC5ZfK3q1IFzdIJQ_e-1xUwJT
      UAT_EMAIL: maloltzahi+rfl-uat-20260828@gmail.com
      UAT_PASSWORD: Rfl-Uat-2026-Strong-47!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Live Supabase signup UAT
        run: |
          node - <<'NODE'
          const { createClient } = require('@supabase/supabase-js')
          const client = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
          })
          ;(async () => {
            const { data, error } = await client.auth.signUp({
              email: process.env.UAT_EMAIL,
              password: process.env.UAT_PASSWORD,
              options: { emailRedirectTo: 'https://firearms-licensing.vercel.app/auth/callback?next=/app' }
            })
            console.log(JSON.stringify({
              ok: !error,
              code: error?.code ?? null,
              message: error?.message ?? null,
              status: error?.status ?? null,
              user: Boolean(data?.user),
              session: Boolean(data?.session),
              emailConfirmed: Boolean(data?.user?.email_confirmed_at)
            }))
            if (error) process.exit(1)
            process.exit(0)
          })().catch((error) => {
            console.log(JSON.stringify({ ok: false, code: 'unexpected', message: error?.message ?? String(error) }))
            process.exit(1)
          })
          NODE
