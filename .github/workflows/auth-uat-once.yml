name: Auth UAT Once

on:
  push:
    branches:
      - rc/production-readiness-2026-08-27

permissions:
  contents: read

jobs:
  auth-uat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: https://lcvshepgzizrlqbzvjoe.supabase.co
      SUPABASE_KEY: sb_publishable_44F1VklC5ZfK3q1IFzdIJQ_e-1xUwJT
    steps:
      - name: Probe Supabase edge connectivity
        shell: bash
        run: |
          set -u
          probe() {
            label="$1"; shift
            set +e
            out=$(curl -4 -sS --connect-timeout 5 --max-time 10 -o /tmp/probe-body -w 'http=%{http_code} remote=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}' "$@" 2>/tmp/probe-err)
            rc=$?
            set -e
            echo "$label rc=$rc $out"
            if [ -s /tmp/probe-err ]; then sed -n '1,3p' /tmp/probe-err; fi
          }
          probe ROOT "$SUPABASE_URL/"
          probe AUTH_HEALTH "$SUPABASE_URL/auth/v1/health"
          probe REST "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"
          probe AUTH_SETTINGS "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY"
          echo 'CONNECTIVITY_PROBE_COMPLETE'
