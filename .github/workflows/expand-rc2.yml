name: Expand RC2

on:
  push:
    branches:
      - rc/production-readiness-2026-08-27

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct RC2 application core
        shell: bash
        run: |
          set -euo pipefail
          test -d .rc2/chunks
          cat .rc2/chunks/chunk-* > /tmp/app-core.b64
          test "$(wc -c < /tmp/app-core.b64)" -eq 134956
          base64 --decode /tmp/app-core.b64 > /tmp/app-core.tar.gz
          echo "2f88a372444ed959b20e147a72f1919464d58e5c362740522412b64112d21e3c  /tmp/app-core.tar.gz" | sha256sum -c -
          gzip -t /tmp/app-core.tar.gz
          tar -xzf /tmp/app-core.tar.gz -C .
          rm -rf .rc2
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RC2: expand application core'
          git push origin HEAD:rc/production-readiness-2026-08-27
