let state={device:new URLSearchParams(location.search).get('device')||'mobile',screen:new URLSearchParams(location.search).get('screen')||'75'};
function syncUrl(){history.replaceState({},'',`?device=${state.device}&screen=${state.screen}`)}
function setDevice(d){state.device=d;state.screen=d==='mobile'?'75':'T01';syncUrl();render()}
function setScreen(s){state.screen=s;syncUrl();render()}
function progress(){return `<div class="progress"><div class="steps">${[1,2,3,4,5].map((n,i)=>`<div class="step ${i===0?'active':''}"><small>0${n}</small></div>`).join('')}</div></div>`}
function header(n,mode,tabletMode=false){return `<header class="rfl-header ${tabletMode?'tablet':''}"><div class="rfl-brand">${tabletMode?'עו״ד צחי מלול / RFL':'RFL'}</div><div class="rfl-mode">${tabletMode?'TABLET / ':''}${mode}</div><div class="rfl-code">${n}</div></header>`}

(d.type==='payment'){return guidedShell(n,d,`<div class="next-card"><div class="label">SERVICE SCOPE</div><h3>היקף שירות שאושר</h3><div class="meta">סכום יוצג רק לאחר אישור היקף השירות.</div></div><button class="btn primary" style="width:100%">מעבר לתשלום</button>`)} if(d.type==='client'){return `${header(n,d.mode)}<main class="page"><div class="kicker">${d.k}</div><h1 class="title">${d.title}</h1><p class="body">${d.body}</p><div class="accent"></div><section class="card"><div class="next-card"><div class="label">NEXT ACTION</div><h3>להשלים מסמך תומך</h3><div class="meta">פריט אחד חסר לפני בדיקת עו״ד.</div></div><div class="stats3"><div class="stat"><span>מסמכים</span><strong>3 / 4</strong></div><div class="stat"><span>הודעות</span><strong>1</strong></div><div class="stat orange"><span>משימות</span><strong>1</strong></div></div><button class="btn primary" style="width:100%;margin-top:64px" onclick="setScreen('81')">פתיחת הפעולה</button></section></main>`} if(d.type==='status'){return `${header(n,d.mode)}<main class="page"><div class="kicker">${d.k}</div><h1 class="title">${d.title}</h1><p class="body">${d.body}</p><div class="accent"></div><section class="card"><div class="journey-list" style="margin-left:8px">${['נשלח','נקלט','ממתין','פעולה הבאה'].map((x,i)=>`<div class="journey-item">0${i+1} · ${x}</div>`).join('')}</div><div class="guard" style="color:var(--text)">מקור הסטטוס: תיעוד בתיק / מידע חיצוני רק כאשר נקלט.</div></section></main>`} if(d.type==='appeal'){return `${header(n,d.mode)}<main class="page"><div class="kicker">${d.k}</div><h1 class="title">${d.title}</h1><p class="body">${d.body}</p><div class="accent"></div><section class="card"><div class="appeal-grid"><div><div class="appeal-num">45</div><div class="appeal-days" style="font-size:26px">ימים</div></div><div class="meta">יש לאמת את המועד בתיק לפני פעולה.</div></div>${rowHtml(['החלטת דחייה','מסמך מקור','קיים'])}${rowHtml(['מועד קבלה','נדרש אימות','לעיון'])}${rowHtml(['ראיות לערר','חלקי','חסר'])}</ function legalTablet(){return `<div class="tablet-page">${tabletHeader('LEGAL')}<div class="tablet-content"><div class="tablet-kicker">12–14 / LEGAL READING</div><h1 class="tablet-title">קריאה משפטית רחבה, לא דחוסה.</h1><p class="tablet-body">Privacy / Terms / Accessibility משתמשים ב־640px readable width בתוך 944px container. כותרות וסעיפים נשארים RTL, מקורות והערות לא נשברים למיקרו־טקסט.</p><section class="card legal-read">${['עקרונות והיקף','מידע, שימוש וזכויות','אבטחה / נגישות / פנייה','גרסה ומקור משפטי'].map((x,i)=>`<section><div class="label">0${i+1}</div><h3 style="font-size:22px;margin:8px 0">${x}</h3><p class="body" style="margin:0">הטקסט הסופי מוזן רק מהנוסח המשפטי המאושר; אין השלמה אוטומטית.</p></section>`).join('')}</section></div></div>`}
function renderTablet(key){let d=tablet[key];if(!d)return homeTablet();if(d.type==='home')return homeTablet();if(d.type==='guided')return guidedTablet();if(d.type==='client')return clientTablet();if(d.type==='ops')return opsTablet();return legalTablet()}
function nextMobile(n){let next=Math.min(93,n+1);setScreen(String(next))}
function rebuildSelect(){let sel=document.getElementById('screenSelect');let opts=state.device==='mobile'?Object.keys(mobile).map(k=>`<option value="${k}" ${state.screen===k?'selected':''}>${k} / ${mobile[k].k}</option>`):Object.keys(tablet).map(k=>`<option value="${k}" ${state.screen===k?'selected':''}>${k} / ${tablet[k].name}</option>`);sel.innerHTML=opts.join('')}
function render(){let dev=document.getElementById('device');dev.className='device '+state.device;document.getElementById('mobileBtn').classList.toggle('active',state.device==='mobile');document.getElementById('tabletBtn').classList.toggle('active',state.device==='tablet');if(state.device==='mobile'){if(!mobile[state.screen])state.screen='75';dev.innerHTML=renderMobile(+state.screen,mobile[state.screen])}else{if(!tablet[state.screen])state.screen='T01';dev.innerHTML=renderTablet(state.screen)}rebuildSelect();syncUrl()}
render();
</script>
