<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>RFL — Stage 04 Lawyer Cockpit</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap');:root{--n:#0b223d;--o:#ff6a1a;--b:#0b6f9c;--s:#ddf3fc;--i:#07182b;--t:#526171;--m:#8d9aa6;--bd:#dce3e9;--bg:#f7f9fb;--inf:#f0fafe;--ok:#2c7a57;--w:#a8660a;--e:#a93434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:'IBM Plex Sans Hebrew',Arial,sans-serif}button,input,textarea{font:inherit}.auth{min-height:100vh;background:var(--n);display:grid;place-items:center;padding:30px}.card{background:white;border:1px solid var(--bd);border-radius:14px;padding:24px;box-shadow:0 2px 8px #07182b0f}.auth .card{width:620px;max-width:100%}.code{font-size:12px;color:var(--b);letter-spacing:.4px;direction:ltr}.auth h1{font-size:34px;margin:12px 0}.auth p,.body{color:var(--t);line-height:1.6}.field{display:grid;gap:6px;margin:14px 0}.field input,.field textarea{height:46px;border:1px solid var(--bd);border-radius:8px;padding:0 12px}.field textarea{height:88px;padding-top:10px}.btn{height:44px;border:0;border-radius:8px;padding:0 18px;font-weight:500;cursor:pointer}.primary{background:var(--o);color:var(--i)}.ghost{background:white;border:1px solid var(--bd)}.nav{position:fixed;right:0;top:0;width:230px;height:100vh;background:var(--n);color:white;padding:20px 12px}.nav b{display:block;font-size:16px}.nav small{color:var(--s)}.nav button{display:block;width:206px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--s);text-align:right;padding:0 18px;margin:5px 0}.nav button.active{background:var(--inf);color:var(--i)}.legal{position:absolute;bottom:90px;right:18px;width:190px;color:var(--s);font-size:12px;direction:ltr}.main{margin-right:230px}.top{height:64px;background:white;border-bottom:1px solid #eef2f5;display:flex;align-items:center;justify-content:space-between;padding:0 40px}.top h2{font-size:26px;margin:0;font-weight:500}.tag{font-size:12px;background:var(--inf);color:var(--b);border-radius:14px;padding:6px 16px}.head{height:156px;padding:25px 40px;position:relative}.head .body{width:540px;margin-top:12px}.accent{position:absolute;right:40px;bottom:28px;width:160px;height:4px;background:var(--o)}.work{margin:0 24px 40px;min-height:620px}.label{font-size:12px;color:var(--b);letter-spacing:.4px;direction:ltr;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;direction:ltr}.stat{border:1px solid var(--bd);border-radius:12px;padding:15px}.stat:first-child{background:var(--inf)}.stat span{font-size:12px;color:var(--m)}.stat strong{display:block;font-size:48px;margin-top:8px}.review strong{color:var(--o)}.warn strong{color:var(--w)}.err strong{color:var(--e)}.ok strong{color:var(--ok)}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}th{font-size:12px;color:var(--m)}td:first-child{font-weight:500;color:var(--i)}tr:hover{background:var(--inf)}.pill{display:inline-flex;min-width:92px;height:28px;border-radius:14px;align-items:center;justify-content:center;background:var(--inf);font-size:12px;color:var(--b);direction:ltr}.pill.WARN{background:#fff1d6;color:var(--w)}.pill.ERR{background:#fde6e6;color:var(--e)}.pill.OK{color:var(--ok)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.dark{background:var(--n);color:white}.dark p{color:var(--s)}.rows .r{display:grid;grid-template-columns:220px 1fr 130px;gap:18px;align-items:center;min-height:58px;border-bottom:1px solid var(--bd)}.rows .r span{color:var(--t);font-size:14px}.gate{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.guard{margin-top:16px;padding:14px;background:var(--inf);border:1px solid var(--bd);border-radius:9px;color:var(--t);font-size:12px}.qa{position:fixed;left:14px;bottom:14px}.qa select{height:36px;border:1px solid var(--bd);border-radius:8px;padding:0 8px}@media(max-width:900px){.nav{position:static;width:auto;height:auto}.nav button{display:inline-block;width:auto}.legal{display:none}.main{margin:0}.stats,.grid,.gate{grid-template-columns:1fr}.rows .r{grid-template-columns:1fr 100px}.head{height:auto}.head .body{width:auto}.work{margin:20px}}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}</style></head><body><div id="root"></div><script>
const S={49:['SECURE LOGIN','כניסה למרחב העבודה המשפטי.','הגישה מיועדת לעורכי דין וצוות מורשה. מידע רגיש ופעולות מהותיות נשמרים עם audit trail.','login'],50:['VERIFY SESSION','אימות נוסף לפני מידע רגיש.','שלב אימות נפרד מונע גישה לתיק רק על בסיס סיסמה ומשאיר תיעוד של האימות.','mfa'],51:['OPERATIONS OVERVIEW','מה דורש החלטה עכשיו?','הדשבורד מדרג עבודה לפי gate, פער, מועד וסיכון — לא לפי “לקוחות אחרונים”.','dash'],52:['INQUIRIES','פניות חדשות עם הקשר מינימלי.','כל פנייה מציגה סוג הליך, מצב פתיחה ופעולה ראשונה לפני יצירת תיק מלא.','table'],53:['CASES','רשימת תיקים שמספרת מה תקוע.','סינון לפי gate, מסמך חסר, מועד, עו״ד מטפל וסטטוס.','table'],54:['CASE 360','תיק אחד / כל ההקשר.','זהות, תבחין, ראיות, flags, החלטות והיסטוריה נפגשים במסך עבודה אחד.','case'],55:['CLIENT PROFILE','פרופיל הלקוח נפרד מהכרעת התיק.','פרטי קשר וזהות לצד תיקים קודמים, בלי להפוך היסטוריה להחלטה אוטומטית.','rows'],56:['IDENTITY VERIFICATION','מאמתים עובדה ומקור.','כל שדה מקבל מקור וסטטוס אימות; סתירה נשארת גלויה עד פתרון.','rows'],57:['CRITERIA REVIEW','תבחין הוא hypothesis לבדיקה.','המסך מציג את המסלול שנבדק, העובדות התומכות, המקור והפערים — לא חיווי זכאות.','rows'],58:['QUESTIONNAIRE REVIEW','השאלון מתורגם לעובדות וראיות.','עורך הדין רואה תשובה, מקור, מסמך קשור וחריגה.','rows'],59:['DOCUMENT REVIEW','המסמך נבדק לפי התפקיד שלו בתיק.','קובץ, metadata, טענה מקושרת, הערת עו״ד וסטטוס ביקורת.','rows'],60:['EVIDENCE CHAIN','כל מסקנה חוזרת לראיה.','שרשרת הראיות שומרת מקור, גרסה, קישור לטענה, שינוי ו-chain hash לצורכי audit.','evidence'],61:['MEDICAL REVIEW','מידע רפואי נשאר רגיש ומוגבל.','אין אבחון או חיווי כשירות אוטומטי.','medical'],62:['RISK FLAGS','דגל הוא אות לבדיקה. לא החלטה.','flags פנימיים נועדו למקד בדיקה ואינם מוצגים ללקוח כרמת זכאות.','risk'],63:['LEGAL DECISION GATE','החלטה רק עם עו״ד מזוהה.','REVIEW / BLOCK / NEEDS INFO / APPROVED זמינים רק לאחר ראיות, הסבר ו-audit context.','decision'],64:['LAWYER QUEUE','ה-Queue מסודר לפי דחיפות משפטית.','deadline, BLOCK, missing evidence ומשך המתנה קודמים ל“מי נכנס אחרון”.','queue'],65:['SUBMISSION TRACKING','אחרי הגשה — שומרים מקור וסטטוס.','המסך מתעד payload, מסמכים שנשלחו, מזהה פעולה ועדכונים.','rows'],66:['INTERVIEW','ראיון מנוהל כאירוע בתיק.','מועד, זימון, הכנה, סיכום והמשך פעולה נשמרים בנפרד.','rows'],67:['APPEAL WORKSPACE','ערר הוא workspace עם deadline.','החלטה, מועד קבלה, 45 יום, נימוקים, ראיות, טיוטה ואישור עו״ד באותו הקשר.','appeal'],68:['PAYMENTS / REFUNDS','כסף נפרד מהחלטה משפטית.','חיובים, זיכויים וקבלות ללא השפעה על gate או status משפטי.','rows'],69:['MESSAGING','תבניות הודעה עם guardrails.','הודעה אינה שולחת קביעה משפטית או status שלא אושר.','rows'],70:['CRM / CONTENT','תוכן תפעולי בלי לזהם את תיק הראיות.','מקורות תוכן, FAQ ותבניות נשמרים בנפרד ממסמכי לקוח.','rows'],71:['USERS / ROLES','הרשאה קובעת מה רואים ומה עושים.','Least privilege למידע רגיש ולהחלטות.','rows'],72:['AUDIT / SECURITY','פעולה רגישה משאירה עקבה.','מי צפה, מי שינה, מי אישר, מה היה לפני ומה אחרי.','audit'],73:['REPORTS / INTEGRATIONS','דוחות ואינטגרציות קוראים מהמערכת — לא מחליטים בשמה.','Decision Gate אינו writable ממערכת חיצונית.','reports'],74:['SETTINGS / COMPLIANCE','כלל משפטי משתנה רק עם מקור ואישור.','מקורות, גרסאות, lawyer verification, PDF gates, retention ו-security policies.','settings']};
let st={gate:'REVIEW',audit:[]};try{st=JSON.parse(localStorage.getItem('rfl4')||'{"gate":"REVIEW","audit":[]}')}catch(e){st={gate:'REVIEW',audit:[]}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('rfl4',JSON.stringify(st));const cur=()=>Math.min(74,Math.max(49,+new URLSearchParams(location.search).get('screen')||49));const go=n=>{history.pushState({},'',location.pathname+'?screen='+n);render()};const pill=x=>`<span class="pill ${x==='BLOCK'?'ERR':x==='NEEDS INFO'?'WARN':x==='APPROVED'?'OK':''}">${x}</span>`;
function nav(n){let items=[['Dashboard',51],['תיקים',53],['Queue',64],['מסמכים',60],['עררים',67],['התראות',62],['ניהול',71]];return `<aside class="nav"><b>RFL / COCKPIT</b><small>PRIVATE / COUNSEL</small>${items.map(x=>`<button class="${x[1]===n?'active':''}" onclick="go(${x[1]})">${x[0]}</button>`).join('')}<div class="legal">LEGAL GATE<br>automatic decision = false</div></aside>`}
const dataRows=()=>[['תיק 1042','בקשה חדשה','מסמך חסר / לעיון','REVIEW'],['תיק 1043','בקשה חדשה','תימוכין חסר','NEEDS INFO'],['תיק 1044','ערר','מועד מתקרב','BLOCK'],['תיק 1045','בקשה חדשה','מוכן לעיון','APPROVED']];
function table(){return `<table><thead><tr><th>תיק / לקוח</th><th>הליך</th><th>מצב</th><th>Gate</th></tr></thead><tbody>${dataRows().map(r=>`<tr onclick="go(54)"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${pill(r[3])}</td></tr>`).join('')}</tbody></table>`}
function dash(){return `<div class="stats"><div class="stat review"><span>WAITING REVIEW</span><strong>12</strong></div><div class="stat warn"><span>NEEDS INFO</span><strong>8</strong></div><div class="stat err"><span>APPEAL DEADLINE</span><strong>3</strong></div><div class="stat ok"><span>APPROVED</span><strong>18</strong></div></div><h2>החלטות שמחכות לעו״ד</h2>${table()}`}
function rows(n){let sets={55:[['זהות','מאומתת','APPROVED'],['פרטי קשר','מאומתים','APPROVED'],['היסטוריית תיקים','2 תיקים','REVIEW']],56:[['מספר זהות','מקור: תעודה','APPROVED'],['שם','מקור: תעודה','APPROVED'],['כתובת','סתירה במקור','REVIEW'],['תאריך לידה','מקור: תעודה','APPROVED']],57:[['עובדה 1','נתמכת במסמך','APPROVED'],['עובדה 2','דורשת עיון','REVIEW'],['פער','חסר תימוכין','NEEDS INFO']],58:[['שאלה 1','תשובה + מקור','APPROVED'],['שאלה 2','תשובה + מסמך','APPROVED'],['שאלה 3','דורשת השלמה','NEEDS INFO']],59:[['קובץ','document.pdf','APPROVED'],['Metadata','נקלט','APPROVED'],['טענה מקושרת','טענה 3','REVIEW']],65:[['Payload','v3','APPROVED'],['מסמכים שנשלחו','4','APPROVED'],['Acknowledgement','ממתין','REVIEW']],66:[['מועד','תועד','APPROVED'],['זימון','נשלח','APPROVED'],['סיכום','דורש עיון','REVIEW']],68:[['חיוב 1042','שולם','APPROVED'],['זיכוי 1043','בוצע','APPROVED'],['בדיקה 1044','נדרש עיון','REVIEW']],69:[['בקשת מסמך','תפעולי','APPROVED'],['עדכון סטטוס','תפעולי','APPROVED'],['הודעה משפטית','דורשת עיון','REVIEW']],70:[['FAQ ציבורי','מאושר','APPROVED'],['תבניות שירות','מאושר','APPROVED'],['מקור חדש','דורש השלמה','NEEDS INFO']],71:[['עו״ד','מידע רגיש + החלטה','APPROVED'],['צוות','מידע מוגבל','APPROVED'],['מנהל','ניהול','APPROVED'],['תפקיד חדש','חסום כברירת מחדל','BLOCK']]};return `<div class="rows">${(sets[n]||[['פריט','מצב','REVIEW']]).map(r=>`<div class="r"><b>${r[0]}</b><span>${r[1]}</span>${pill(r[2])}</div>`).join('')}</div>`}
function case360(){return `<div class="grid"><div class="card"><div class="code">CASE SPINE</div>${['פתיחת תיק','מסמך חדש','פער זוהה','העברה לעו״ד','החלטה'].map((x,i)=>`<p>${i===3?'●':'○'} ${x}</p>`).join('')}</div><div class="card dark"><div class="code" style="color:var(--s)">LEGAL DECISION GATE</div><h1>${st.gate}</h1><p>אין החלטה אוטומטית. הפעולה הסופית מחייבת עו״ד.</p><button class="btn primary" onclick="go(63)">פתיחת Gate</button></div></div>`}
function evidence(){return `<table><thead><tr><th>ID</th><th>טענה</th><th>מקור</th><th>גרסה</th><th>סטטוס</th></tr></thead><tbody>${Array.from({length:7},(_,i)=>`<tr><td>E-${100+i}</td><td>טענה ${i+1}</td><td>${i%2?'מסמך משתמש':'gov.il / מקור'}</td><td>v${i+1}</td><td>${pill(i===5?'REVIEW':'APPROVED')}</td></tr>`).join('')}</tbody></table><div class="guard">CHAIN HASH / 88c2…b14a · כל שינוי בראיה או בקישור נרשם ב-audit.</div>`}
function medical(){return `<div class="card dark"><div class="code" style="color:var(--s)">SENSITIVE / RESTRICTED</div><h2>מסמך רפואי / הצהרה</h2><p>תוכן מוצג רק לבעלי הרשאה מתאימה. אין inference רפואי או החלטת כשירות אוטומטית.</p>${pill('REVIEW')}</div>`}
function risk(){return `<div class="rows">${[['R-04','סתירה בין הצהרה למסמך','REVIEW'],['R-09','מסמך חסר למסלול','NEEDS INFO'],['R-12','מועד ערר מתקרב','REVIEW'],['R-18','מידע רגיש ללא החלטת עו״ד','BLOCK']].map(r=>`<div class="r"><b>${r[0]} · ${r[1]}</b><span>מקור מתועד</span>${pill(r[2])}</div>`).join('')}</div><div class="guard">INTERNAL ONLY / flags אינם חלק מהפלט הציבורי.</div>`}
function decision(){return `<div class="gate"><div class="card"><h2>מזכר החלטה</h2><div class="field"><label>נימוק / מקור</label><textarea id="reason" aria-label="נימוק ומקור להחלטה">${esc(st.reason||'')}</textarea></div><div class="actions">${['REVIEW','NEEDS INFO','BLOCK','APPROVED'].map(x=>`<button class="btn ${x==='APPROVED'?'primary':'ghost'}" onclick="setGate('${x}')">${x}</button>`).join('')}</div></div><div class="card dark"><div class="code" style="color:var(--s)">ATTORNEY ONLY</div><h1>${st.gate}</h1><p>Gate change requires identified lawyer + explanation + audit context.</p></div></div>`}
function setGate(g){let r=document.getElementById('reason').value.trim();if(r.length<8)return alert('נדרש הסבר לפני שינוי Gate');let p=st.gate;st.gate=g;st.reason=r;st.audit.unshift([new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),'עו״ד צחי מלול','GATE CHANGE',`${p} → ${g}`]);save();render()}
function queue(){return `<div class="guard">Priority = deadline + BLOCK + missing evidence + waiting time.</div>${table()}`}
function appeal(){return `<div class="grid"><div class="card dark"><div class="code" style="color:var(--s)">DEADLINE</div><h1 style="font-size:76px;color:var(--o);margin:12px 0">45</h1><p>ימים · לפי השירות הרשמי; יש לאמת את המועד בתיק.</p></div><div class="card"><h2>Appeal evidence map</h2>${rows(57)}</div></div>`}
function audit(){let a=[...st.audit,['10:21','עו״ד צחי מלול','MFA VERIFIED','SESSION'],['10:28','עו״ד צחי מלול','VIEW SENSITIVE','MEDICAL DOC']];return `<div class="guard">SESSION / SECURITY · MFA verified · sensitive action audit required</div><table><thead><tr><th>זמן</th><th>משתמש</th><th>פעולה</th><th>אובייקט / שינוי</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table>`}
function reports(){return `<div class="grid"><div class="card"><h2>Reports / exports</h2><p>Case status export · audit export · queue report</p><button class="btn ghost" onclick="alert('Preview בלבד')">יצירת Export</button></div><div class="card dark"><div class="code" style="color:var(--s)">INTEGRATION BOUNDARY</div><p>API / export יכולים לקרוא נתונים לפי הרשאות.<br><br>Decision Gate אינו writable ממערכת חיצונית.</p>${pill('BLOCK')}</div></div>`}
function settings(){return `<div class="rows">${[['Legal sources','עדכון מקור מחייב approval'],['Lawyer verification','חובה לפני Gate change'],['PDF generation','נחסם ב-BLOCK'],['Retention','לפי policy מאושרת'],['Sensitive access','role + audit'],['Reduced motion','נתמך בממשק']].map(r=>`<div class="r"><b>${r[0]}</b><span>${r[1]}</span>${pill('APPROVED')}</div>`).join('')}</div>`}
function auth(n,d){return `<main class="auth"><section class="card"><div class="code">${n} / ${d[0]}</div><h1>${d[1]}</h1><p>${d[2]}</p>${n===49?'<div class="field"><label>דוא״ל</label><input value="lawyer@example.com" aria-label="דוא״ל"></div><div class="field"><label>סיסמה</label><input type="password" value="preview123" aria-label="סיסמה"></div><button class="btn primary" style="width:100%" onclick="go(50)">כניסה מאובטחת</button>':'<div class="field"><label>קוד אימות</label><input value="••••••" aria-label="קוד אימות"></div><button class="btn primary" style="width:100%" onclick="go(51)">אימות וכניסה</button>'}</section></main>`}
function work(n,d){let t=d[3];if(t==='dash')return dash();if(t==='table')return table();if(t==='case')return case360();if(t==='rows')return rows(n);if(t==='evidence')return evidence();if(t==='medical')return medical();if(t==='risk')return risk();if(t==='decision')return decision();if(t==='queue')return queue();if(t==='appeal')return appeal();if(t==='audit')return audit();if(t==='reports')return reports();if(t==='settings')return settings();return table()}
function render(){let n=cur(),d=S[n];if(n<51){root.innerHTML=auth(n,d);return}root.innerHTML=`${nav(n)}<main class="main"><header class="top"><h2>${d[1]}</h2><div><span class="tag">PRIVATE</span> <span class="code">RFL-2026-001</span></div></header><section class="head"><div class="code">${n} / ${d[0]}</div><div class="body">${d[2]}</div><div class="accent"></div></section><section class="card work"><div class="label">${d[0]}</div>${work(n,d)}</section></main><div class="qa"><select aria-label="בחירת מסך QA" onchange="go(+this.value)">${Object.keys(S).map(x=>`<option value="${x}" ${+x===n?'selected':''}>${x} / ${S[x][0]}</option>`).join('')}</select></div>`}onpopstate=render;render();
</script></body></html>
